name: Release

# 推 v* 标签（如 v0.0.8）自动打包各平台安装包并上传到 Release；
# 也可以在 Actions 页面手动触发（workflow_dispatch）来试跑。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 通用包：一个 dmg 同时支持 Intel 与 M 系列芯片
          - platform: macos-latest
            label: macOS universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin

          # Windows 64 位：输出 NSIS 安装包（*_x64-setup.exe）
          - platform: windows-latest
            label: Windows x64
            rust-targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 前端是 Vue + Vite，需要先装依赖；tauri-action 会按 tauri.conf.json 里的
      # beforeBuildCommand（npm run build）自动构建前端。
      - name: Install frontend deps
        run: npm install

      # 资产名默认直接沿用产品名，而产品名是纯中文，GitHub 会把非 ASCII 字符剥掉、
      # 只剩前导下划线。这里改成「包名(identifier)最后一段 + 版本 + 架构」命名，
      # 例如 cleanc_0.0.8_universal.dmg。
      - name: Resolve asset prefix
        id: asset-prefix
        shell: bash
        run: |
          prefix=$(node -p "require('./src-tauri/tauri.conf.json').identifier.split('.').pop()")
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "资产名前缀：$prefix"

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 唐三浪清理 v__VERSION__
          # 注意：tauri-action@v0 的输入名是 assetNamePattern
          # （dev 分支已改名为 releaseAssetNamePattern，升级时需同步）
          # [version] [arch] [setup] [ext] 由 action 按产物填充；[setup] 仅 nsis 安装包有值
          assetNamePattern: ${{ steps.asset-prefix.outputs.prefix }}_[version]_[arch][setup][ext]
          releaseBody: |
            唐三浪清理 v__VERSION__：跨平台（Windows / macOS）的系统垃圾清理与磁盘空间管理工具。

            本版改进：界面视觉体系整体对齐「唐三浪 DBMan」。
            - **统一的青紫视觉语言**：半透明毛玻璃面板 + 背景径向光晕 + 42px 网格底纹，
              按钮改为渐变描边 / 悬停发光，滚动条、导航选中态、标题统一走品牌渐变。
            - **双主题分色**：深色主题完全采用 DBMan 的青、紫、品红配色；浅色主题保留
              绿色品牌色（清理工具的安全语义），**默认仍是亮色**，可随时手动切换。
            - **深色下的原生标题栏同步变暗**：不再出现界面已变深、顶部还顶着一条浅灰
              系统标题栏的割裂感。
            - **设计令牌统一收口**：所有颜色 / 圆角 / 发光集中在 tokens.css，组件内不再
              写死色值，后续换肤与调整不会再出现零散硬编码。

            上一版（v0.0.7）的改进一并包含：迁移完成后列表即时刷新并按迁移账本对账、
            设置页新增「默认目标盘」。更早的 v0.0.6 修复也都在：高级迁移建 junction 失败
            导致「搬到一半又整体回搬」、中文 Windows 下 cmd / robocopy 输出乱码、扫描界面
            抖动、清理后列表不刷新、macOS 每删一个文件响一次废纸篓音效。

            主要能力：
            - **安全清理**：内置白名单，只清缓存 / 日志等可安全重建的目录，不碰你的其他文件；
              删除默认进回收站（macOS 为废纸篓），可随时还原，勾选「直接删除」才会立即释放
            - **全程有反馈**：扫描 / 删除过程中实时显示进度与旋转指示，界面不卡死，
              可随时【暂停 / 继续 / 停止】—— 彻底解决旧版本处理大目录时「像卡住」的问题
            - **大文件**：按体积从大到小列出用户数据区的大文件（只读，不提供删除入口）
            - **已装软件**：Windows 读注册表、macOS 扫 /Applications，盘点各软件真实体积（只读）
            - **高级迁移（仅 Windows）**：把 C 盘大目录整体搬到其他盘，原位置留一个 junction 联接，
              系统和软件完全无感知；含迁移账本 / 一键还原 / 整理 / 未验证候选发现
            - **完全离线**：不联网、不上传任何数据

            下载对应平台安装包即可：
            - Windows：`*_x64-setup.exe`（双击安装）
            - macOS：通用 dmg，同时支持 Intel 与 Apple 芯片

            > macOS 首次打开若提示「无法验证开发者」，是因为安装包未做 Apple 公证。
            > 把 app 拖进「应用程序」后执行一次下面这条命令即可（只需一次）：
            > `xattr -dr com.apple.quarantine "/Applications/唐三浪清理.app"`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
