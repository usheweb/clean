[package]
name = "clean-c"
version = "0.0.6"
description = "唐三浪清理 —— 跨平台系统垃圾清理与磁盘空间管理工具"
authors = ["tangsanlang"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "clean_c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
dirs = "6"
chrono = "0.4"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
